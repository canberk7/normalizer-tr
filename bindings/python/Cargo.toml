[package]
name = "normalizer-tr-python"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Typed Python binding for the bounded Rust Turkish text normalizer"
repository = "https://github.com/erdemtuna/normalizer-tr"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
normalizer-tr = { path = "../..", version = "=0.3.0" }
pyo3 = { version = "=0.29.3", features = ["extension-module"] }

[lints.rust]
unsafe_code = "forbid"
